services:
  pgvector:
    image: pgvector/pgvector:0.8.5-pg17
    container_name: pgvector-db
    restart: unless-stopped
    ports:
      - "10.0.10.30:5432:5432"
    env_file:
      - pgvector.env
    volumes:
      - /home/fenkil/pcData/pgvector/data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
