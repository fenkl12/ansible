  services:
    pgvector:
      image: pgvector/pgvector:0.8.5-pg17
      container_name: pgvector-db
      restart: unless-stopped
      ports:
        - "10.0.10.30:5432:5432"
      env_file:
        - pgvector.env
      volumes:
        - /home/fenkil/pcData/pgvector/data:/var/lib/postgresql/data
        - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      healthcheck:
        test:
          [
            "CMD-SHELL",
            "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
          ]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s

    pgadmin:
      image: dpage/pgadmin4:9.17
      container_name: pgvector-pgadmin
      restart: unless-stopped
      ports:
        - "10.0.10.30:5050:80"
      environment:
        PGADMIN_DEFAULT_EMAIL: "fen@gmail.com"
        PGADMIN_DEFAULT_PASSWORD: "fenkl123"
      volumes:
        - pgadmin_data:/var/lib/pgadmin
      depends_on:
        pgvector:
          condition: service_healthy

  volumes:
    pgadmin_data:
