services:
  n8n:
    image: n8nio/n8n:2.45.7
    container_name: n8n
    restart: unless-stopped
    ports:
      - 5678:5678
    environment:
      - TZ=America/Toronto
      - GENERIC_TIMEZONE=America/Toronto
      - N8N_HOST=10.0.10.30
      - N8N_PROTOCOL=http
      - N8N_PORT=5678
      - N8N_EDITOR_BASE_URL=http://10.0.10.30:5678
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_SECURE_COOKIE=false
    volumes:
      - /home/fenkil/pcData/n8n/data:/home/node/.n8n
