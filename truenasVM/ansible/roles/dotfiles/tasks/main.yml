---
- name: Resolve dotfiles user
  ansible.builtin.getent:
    database: passwd
    key: "{{ dotfiles_user }}"
- name: Clone or update dotfiles without discarding local changes
  become_user: "{{ dotfiles_user }}"
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_directory }}"
    version: "{{ dotfiles_version }}"
    update: true
    force: false
- name: Ensure dotfiles ownership
  ansible.builtin.file:
    path: "{{ dotfiles_directory }}"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    recurse: true
- name: Use Zsh as login shell
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    shell: /usr/bin/zsh
- name: Schedule weekly fast-forward-only dotfiles update
  ansible.builtin.cron:
    name: Update dotfiles repository
    user: "{{ dotfiles_user }}"
    minute: "0"
    hour: "0"
    weekday: "{{ dotfiles_update_weekday }}"
    job: "cd {{ dotfiles_directory | quote }} && /usr/bin/git pull --ff-only"
- name: Validate configured nested playbook paths
  ansible.builtin.assert:
    that:
      - item is string
      - item | length > 0
      - not item.startswith('/')
      - "'..' not in item.split('/')"
      - item.endswith('.yml') or item.endswith('.yaml')
    fail_msg: Nested playbooks must be relative YAML paths inside the dotfiles repository
  loop: "{{ dotfiles_nested_playbooks }}"
  loop_control:
    label: "{{ item }}"
- name: Check configured nested playbooks
  ansible.builtin.stat:
    path: "{{ dotfiles_directory }}/{{ item }}"
  loop: "{{ dotfiles_nested_playbooks }}"
  loop_control:
    label: "{{ item }}"
  register: nested_playbook_files
- name: Require configured nested playbooks to exist
  ansible.builtin.assert:
    that: item.stat.isreg | default(false)
    fail_msg: "Configured nested playbook does not exist: {{ item.item }}"
  loop: "{{ nested_playbook_files.results }}"
  loop_control:
    label: "{{ item.item }}"
- name: Run configured nested playbooks
  become_user: "{{ dotfiles_user }}"
  ansible.builtin.command:
    argv: [ansible-playbook, "{{ item | basename }}"]
    chdir: "{{ dotfiles_directory }}/{{ item | dirname }}"
  loop: "{{ dotfiles_nested_playbooks }}"
  loop_control:
    label: "{{ item }}"
  register: nested_result
  changed_when: "'changed=0' not in nested_result.stdout"

