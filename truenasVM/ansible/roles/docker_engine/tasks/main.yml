---
- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Read Debian package architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_engine_architecture
  changed_when: false

- name: Configure official Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_engine_architecture.stdout }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker Engine and Compose v2
  ansible.builtin.apt:
    name: "{{ docker_engine_packages }}"
    state: present

- name: Enable Docker Engine
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Add managed users to Docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_engine_users }}"
