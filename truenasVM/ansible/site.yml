---
- name: Configure provisioned TrueNAS VM
  hosts: all
  become: true
  gather_facts: true
  pre_tasks:
    - name: Require supported Ubuntu guest
      ansible.builtin.assert:
        that: ansible_distribution == 'Ubuntu'
        fail_msg: The workstation profile currently supports Ubuntu only.
  roles:
    - role: base
    - role: media_autofs
    - role: dotfiles

